name: Update UK Lotto Results

on:
  schedule:
    # UK Lotto draws: Wednesday & Saturday evenings UK time
    # Run same day at 22:15 UTC (after the ~20:00 draw), offset from the
    # EuroMillions job's 22:00 slot so the two don't race on frequency-data.json
    - cron: '15 22 * * 3,6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = re-scrape entire history, update = latest draws only, diagnose = dump page structure to logs'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - full
          - diagnose

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update UK Lotto data (scheduled)
        if: github.event_name == 'schedule'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Update UK Lotto data (manual update)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'update'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Full re-scrape UK Lotto data (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
        run: python setup_scripts/scrape_lotto.py

      - name: Diagnose page structure (manual, temporary)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose'
        run: |
          python3 - <<'PYEOF'
          import requests
          H = {'User-Agent': 'Mozilla/5.0 (compatible; lottery-data-fetcher/1.0)'}

          def show(url):
              print(f"\n===== {url} =====")
              try:
                  r = requests.get(url, timeout=15, headers=H)
                  print(f"status={r.status_code} len={len(r.text)}")
                  import re
                  links = sorted(set(re.findall(r'href="([^"]*lotto/results[^"]*)"', r.text)))
                  print(f"result-link count={len(links)}")
                  print("sample links:", links[:5], "...", links[-5:] if len(links) > 5 else "")
                  print("--- tail 3000 chars ---")
                  print(r.text[-3000:])
              except Exception as e:
                  print("ERROR", e)

          show("https://www.lottery.co.uk/lotto/results/archive-2026")
          show("https://www.lottery.co.uk/lotto/results")
          show("https://www.lottery.co.uk/lotto")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/lotto-results.json assets/data/frequency-data.json assets/js/frequency-data.js
          git diff --staged --quiet || git commit -m "chore: update UK Lotto results [skip ci]"
          git push
