name: Update UK Lotto Results

on:
  schedule:
    # UK Lotto draws: Wednesday & Saturday evenings UK time
    # Run same day at 22:15 UTC (after the ~20:00 draw), offset from the
    # EuroMillions job's 22:00 slot so the two don't race on frequency-data.json
    - cron: '15 22 * * 3,6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = re-scrape entire history, update = latest draws only'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - full

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update UK Lotto data (scheduled)
        if: github.event_name == 'schedule'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Update UK Lotto data (manual update)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'update'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Full re-scrape UK Lotto data (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
        run: python setup_scripts/scrape_lotto.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/lotto-results.json assets/data/frequency-data.json assets/js/frequency-data.js
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update UK Lotto results [skip ci]"

          # frequency-data.json/.js are regenerated by both this workflow and
          # update-euromillions.yml, so a push here can race the other one.
          # Rebase and retry; the only real conflict possible is on those two
          # derived files (lotto-results.json is only ever touched by this
          # workflow), so on conflict just regenerate them fresh from the
          # now-merged results files instead of hand-resolving.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — regenerating frequency data and continuing rebase..."
              python -c "import sys; sys.path.insert(0, 'setup_scripts'); import scrape_lotto; scrape_lotto.generate_frequency_js()"
              git add assets/data/frequency-data.json assets/js/frequency-data.js
              git rebase --continue
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push UK Lotto results after retries"
          exit 1
