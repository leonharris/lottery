name: Update UK Lotto Results

on:
  schedule:
    # UK Lotto draws: Wednesday & Saturday evenings UK time
    # Run same day at 22:15 UTC (after the ~20:00 draw), offset from the
    # EuroMillions job's 22:00 slot so the two don't race on frequency-data.json
    - cron: '15 22 * * 3,6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = re-scrape entire history, update = latest draws only, diagnose = dump page structure to logs'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - full
          - diagnose

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update UK Lotto data (scheduled)
        if: github.event_name == 'schedule'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Update UK Lotto data (manual update)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'update'
        run: python setup_scripts/scrape_lotto.py --update

      - name: Full re-scrape UK Lotto data (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
        run: python setup_scripts/scrape_lotto.py

      - name: Diagnose page structure (manual, temporary)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose'
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, 'setup_scripts')
          import requests
          from bs4 import BeautifulSoup
          import scrape_lotto as sl

          url = "https://www.lottery.co.uk/lotto/results/archive-2026"
          r = requests.get(url, timeout=15, headers=sl.HEADERS)
          soup = BeautifulSoup(r.content, 'html.parser')
          rows = soup.find_all('tr')
          hits = [row for row in rows if row.find('a', href=lambda h: h and '/lotto/results-' in h)]
          print(f"total hits={len(hits)}")

          for row in hits[:8]:
              link = row.find('a', href=lambda h: h and '/lotto/results-' in h)
              parsed = sl.parse_row(row)
              print("\n---ROW---", link.get('href'), repr(link.get_text(strip=True)))
              print("parse_row result:", parsed)
              if parsed is None:
                  print("parse_date:", sl.parse_date(row))
                  print("extract_via_divs:", sl.extract_via_divs(row))
                  print("extract_via_text_cell:", sl.extract_via_text_cell(row))
                  print(str(row)[:1200])
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/lotto-results.json assets/data/frequency-data.json assets/js/frequency-data.js
          git diff --staged --quiet || git commit -m "chore: update UK Lotto results [skip ci]"
          git push
