name: Update EuroMillions Results

on:
  schedule:
    # EuroMillions draws: Tuesday & Friday evenings UK time
    # Run Wednesday & Saturday at 22:00 UTC to be sure results are published
    - cron: '0 22 * * 3'
    - cron: '0 22 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update EuroMillions data
        run: python setup_scripts/scrape_euromillions.py --update

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/euromillions-results.json assets/data/frequency-data.json assets/js/frequency-data.js
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update EuroMillions results [skip ci]"

          # frequency-data.json/.js are regenerated by both this workflow and
          # update-lotto.yml, so a push here can race the other one. Rebase
          # and retry; the only real conflict possible is on those two
          # derived files (euromillions-results.json is only ever touched by
          # this workflow), so on conflict just regenerate them fresh from
          # the now-merged results files instead of hand-resolving.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — regenerating frequency data and continuing rebase..."
              python -c "import sys; sys.path.insert(0, 'setup_scripts'); import scrape_euromillions; scrape_euromillions.generate_frequency_js()"
              git add assets/data/frequency-data.json assets/js/frequency-data.js
              git rebase --continue
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push EuroMillions results after retries"
          exit 1
